<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="PictureReel: descubre películas y series, tendencias, estrenos y tráilers.">
    <title>PictureReel - Películas y Series</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="navbar" id="navbar">
    <div class="navbar-left">
        <a href="#" class="logo" data-view="all">Picture<span>Reel</span></a>
        <nav class="nav-links" aria-label="Principal">
            <button data-view="all" class="active">Inicio</button>
            <button data-view="movie">Películas</button>
            <button data-view="tv">Series</button>
            <button data-view="list">Mi lista</button>
        </nav>
    </div>
    <div class="search-container" id="search-box">
        <button class="search-icon" id="search-toggle" aria-label="Abrir buscador" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
        <input type="search" id="q" placeholder="Títulos, series, películas…" autocomplete="off" aria-label="Buscar">
    </div>
</header>

<section class="hero" id="hero" aria-label="Destacado"></section>

<div class="chips" id="chips" aria-label="Géneros"></div>

<main id="content"></main>
<button class="load-more" id="more" hidden type="button">Cargar más</button>

<footer class="footer">
    <a href="#" class="logo" data-view="all">Picture<span>Reel</span></a>
    <p>© 2026 PictureReel. Proyecto de demostración: no reproduce contenido, solo tráilers.</p>
    <p>Este producto utiliza la API de TMDB, pero no está respaldado ni certificado por TMDB.</p>
</footer>

<nav class="tabbar" aria-label="Navegación móvil">
    <button data-view="all" class="active"><i class="fa-solid fa-house"></i>Inicio</button>
    <button data-view="movie"><i class="fa-solid fa-film"></i>Películas</button>
    <button data-view="tv"><i class="fa-solid fa-tv"></i>Series</button>
    <button data-view="list"><i class="fa-solid fa-bookmark"></i>Mi lista</button>
</nav>

<dialog id="modal" aria-label="Detalles"></dialog>
<div class="spinner-container" id="spinner" aria-live="polite" aria-label="Cargando"><div class="spinner"></div></div>

<script src="js/peliculas.js" defer></script>
</body>
</html>
